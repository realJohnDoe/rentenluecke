name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Adding a label other than `preview` must not rebuild; a closed PR needs no build.
    if: >-
      github.event.action != 'closed' && github.event.action != 'unlabeled' &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
        env:
          BASE_PATH: ${{ github.event_name == 'pull_request' && format('/{0}/pr-preview/pr-{1}/', github.event.repository.name, github.event.number) || format('/{0}/', github.event.repository.name) }}
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          include-hidden-files: true

  # Production deploy, PR preview and its removal, shared by the workshop repos.
  pages:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    uses: realJohnDoe/joes-workshop/.github/workflows/pages.yml@main
    with:
      artifact: site
    permissions:
      contents: write
      pull-requests: write
