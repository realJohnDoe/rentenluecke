name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled, closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Adding a label other than `preview` must not rebuild; a closed PR needs no check.
    if: >-
      github.event.action != 'closed' &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: dist
          path: dist

  # Builds every PR with the preview base path; only the deploy step is gated on
  # the `preview` label. On close it skips the build and just removes the folder.
  # Not a required check.
  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: github.event.action != 'closed'
      - uses: actions/setup-node@v7
        if: github.event.action != 'closed'
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: github.event.action != 'closed'
      - run: pnpm run build
        if: github.event.action != 'closed'
        env:
          BASE_PATH: /rentenluecke/pr-preview/pr-${{ github.event.number }}/
      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        if: github.event.action == 'closed' || contains(github.event.pull_request.labels.*.name, 'preview')
        with:
          source-dir: dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      # github-pages-deploy-action pushes from a git checkout, so it needs one.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: dist
          clean-exclude: pr-preview/
